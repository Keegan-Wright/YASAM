name: .NET Release Linux & Winows

on:
  push:
    tags:
      - "v*"

jobs:
  Build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
      
        include:
          - os: ubuntu-latest
            arch-name: linux-x64
            os-name: linux

          - os: windows-latest
            arch-name: win-x64
            os-name: windows
        
    steps:
    - name: Checkout Latest
      uses: actions/checkout@v4.1.7

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Add community toolset nuget
      uses: deitry/add-nuget-source-action@v2
      with:
        url: https://pkgs.dev.azure.com/dotnet/CommunityToolkit/_packaging/CommunityToolkit-Labs/nuget/v3/index.json

    - name: Restore the application
      run: dotnet restore YASAM.sln

    - name: Build Solution
      run: dotnet publish ./YASAM/YASAM.csproj -r ${{ matrix.arch-name }} -o ./Release --self-contained


    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: YASAM-${{ matrix.os-name }}
        path: ./Release

  Release:
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      attestations: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        path: ./Artifacts

      - name: Create GitHub Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          files: |
            ./Artifacts/*.zip
          draft: true
          prerelease: false
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
